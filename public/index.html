<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koe — Lyrics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login screen -->
  <div id="login-screen">
    <div class="login-inner">
      <div class="logo-mark">声</div>
      <h1 class="app-name">Koe</h1>
      <p class="app-sub">lyrics, in the moment</p>
      <a href="/login" class="login-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
        Connect with Spotify
      </a>
    </div>
    <div class="login-bg">
      <div class="orb orb1"></div>
      <div class="orb orb2"></div>
      <div class="orb orb3"></div>
    </div>
  </div>

  <!-- Player screen -->
  <div id="player" class="hidden">

    <!-- Top bar -->
    <div class="track-bar">
      <div class="track-details">
        <span id="track-name">—</span>
        <span id="artist-name">—</span>
      </div>
      <div class="track-bar-right">
        <span class="annotating-label hidden" id="annotating-label">annotating…</span>
        <div class="status-dot" id="status-dot" title="Live"></div>
      </div>
    </div>

    <!-- Main content -->
    <div class="main-content">

      <!-- LEFT — lyrics -->
      <div class="panel panel-lyrics" id="panel-lyrics">
        <div id="lyrics-container">
          <div class="lyrics-empty" id="lyrics-empty">
            <span>♩</span>
            <p>Waiting for a track…</p>
          </div>
        </div>
      </div>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- RIGHT — analysis -->
      <div class="panel panel-analysis" id="panel-analysis">

        <!-- Translation -->
        <div class="analysis-section" id="section-translation">
          <div class="analysis-label">translation</div>
          <div class="analysis-translation" id="translation-text">—</div>
        </div>

        <!-- Breakdown -->
        <div class="analysis-section" id="section-breakdown">
          <div class="analysis-label">breakdown</div>
          <div class="token-grid" id="token-grid">
            <div class="analysis-placeholder">Play a Japanese track to see the breakdown.</div>
          </div>
        </div>

        <!-- Annotating overlay -->
        <div class="analysis-loading hidden" id="analysis-loading">
          <div class="loading-spinner"></div>
          <p>Annotating lyrics…</p>
        </div>

      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
